site_name: cmdbook
site_description: A DevOps command knowledge base for Kubernetes, Docker, Linux, networking and Git.
site_url: https://stackanchor-net.github.io/cmdbook/
repo_url: https://github.com/StackAnchor-net/cmdbook
repo_name: StackAnchor-net/cmdbook
edit_uri: blob/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Kubernetes:
      - Pods: kubernetes/pods.md
      - Deployments: kubernetes/deployments.md
      - Debugging: kubernetes/debugging.md
      - Networking: kubernetes/networking.md
      - Config: kubernetes/config.md
  - Docker:
      - Containers: docker/containers.md
      - Images: docker/images.md
      - Compose: docker/compose.md
      - Cleanup: docker/cleanup.md
  - Linux:
      - Processes: linux/processes.md
      - Disk: linux/disk.md
      - systemd: linux/systemd.md
      - Files: linux/files.md
      - Text: linux/text.md
      - Troubleshooting: linux/troubleshooting.md
  - Networking:
      - DNS: networking/dns.md
      - IP & sockets: networking/ip-ss.md
      - tcpdump: networking/tcpdump.md
      - TLS & curl: networking/tls-curl.md
  - Git:
      - Setup: git/setup.md
      - Basics: git/basics.md
      - Branches: git/branches.md
      - Remotes: git/remotes.md
      - Stash & undo: git/undo.md
  - Helm:
      - Repositories & charts: helm/repos.md
      - Install & upgrade: helm/install.md
      - Releases & rollback: helm/releases.md
      - Inspect & debug: helm/inspect.md
  - Terraform:
      - Core workflow: terraform/workflow.md
      - State: terraform/state.md
      - Workspaces & modules: terraform/workspaces.md
      - Debugging & formatting: terraform/debugging.md
  - AWS:
      - Identity & config: aws/identity.md
      - EC2: aws/ec2.md
      - S3: aws/s3.md
      - CloudWatch Logs: aws/logs.md
      - EKS & ECR: aws/eks.md
  - SSH:
      - Keys & agent: ssh/keys.md
      - Connecting & config: ssh/connect.md
      - Tunnels & jump hosts: ssh/tunnels.md
      - Copying files: ssh/copy.md
